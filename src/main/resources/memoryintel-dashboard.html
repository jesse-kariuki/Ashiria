<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoryIntel — JVM Intelligence Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;500;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #05060a;
    --bg2: #0c0e16;
    --bg3: #111420;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --muted: #6b7080;
    --accent: #7c6af7;
    --accent2: #3dd9a4;
    --danger: #f76a6a;
    --warn: #f7b76a;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: 48px 1fr;
    grid-template-columns: 280px 1fr 280px;
    grid-template-areas:
      "header header header"
      "left   canvas right";
  }

  /* ── HEADER ── */
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    gap: 24px;
    background: var(--bg);
  }

  .logo {
    font-family: var(--display);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 100px;
    border: 1px solid var(--border2);
    font-size: 11px;
    color: var(--muted);
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .status-dot.live { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }

  .header-stats {
    display: flex;
    gap: 20px;
    margin-left: auto;
  }
  .hstat { display: flex; flex-direction: column; align-items: flex-end; }
  .hstat-val { font-size: 13px; font-weight: 500; color: var(--text); }
  .hstat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .api-input-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    border: 1px solid var(--border2);
    border-radius: 6px;
    background: var(--bg2);
  }
  .api-input-wrap span { color: var(--muted); font-size: 11px; }
  .api-input-wrap input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    width: 180px;
    padding: 6px 0;
  }

  .btn {
    padding: 5px 12px;
    border-radius: 5px;
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .btn:hover { border-color: var(--accent); background: rgba(124,106,247,0.1); }
  .btn.active { border-color: var(--accent); background: rgba(124,106,247,0.15); color: var(--accent); }

  /* ── LEFT PANEL ── */
  .left-panel {
    grid-area: left;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--bg);
  }

  .panel-section { display: flex; flex-direction: column; gap: 8px; }
  .section-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }

  /* Package tracker */
  .pkg-input-row {
    display: flex;
    gap: 6px;
  }
  .pkg-input-row input {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 5px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 8px;
    outline: none;
  }
  .pkg-input-row input:focus { border-color: var(--accent); }

  .pkg-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 11px;
    color: var(--accent);
  }
  .pkg-tag button {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 12px; padding: 0; line-height: 1;
  }
  .pkg-tag button:hover { color: var(--danger); }

  /* Metric cards */
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .metric-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
  }
  .metric-val {
    font-family: var(--display);
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  .metric-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.06em; }

  /* Allocation list */
  .alloc-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .alloc-row:hover { opacity: 0.8; }
  .alloc-row:last-child { border-bottom: none; }
  .alloc-name { font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alloc-bar-wrap { height: 3px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
  .alloc-bar { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .alloc-meta { display: flex; justify-content: space-between; }
  .alloc-count { font-size: 10px; color: var(--muted); }
  .alloc-rate { font-size: 10px; color: var(--accent2); }

  /* Leak suspects */
  .leak-item {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .leak-header { display: flex; justify-content: space-between; align-items: center; }
  .leak-name { font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .confidence-badge {
    font-size: 9px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .conf-LOW    { background: rgba(107,112,128,0.2); color: var(--muted); }
  .conf-MEDIUM { background: rgba(247,183,106,0.15); color: var(--warn); }
  .conf-HIGH   { background: rgba(247,106,106,0.15); color: var(--danger); }
  .conf-CRITICAL { background: rgba(247,106,106,0.3); color: var(--danger); border: 1px solid var(--danger); }
  .leak-evidence { font-size: 10px; color: var(--muted); }

  /* ── CANVAS ── */
  #canvas-wrap {
    grid-area: canvas;
    position: relative;
    overflow: hidden;
  }
  #graph-canvas { width: 100%; height: 100%; display: block; }

  .canvas-overlay {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    display: none;
    min-width: 180px;
    z-index: 10;
  }
  .tooltip-title { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 6px; word-break: break-all; }
  .tooltip-row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
  .tooltip-row span:last-child { color: var(--text); }

  /* ── RIGHT PANEL ── */
  .right-panel {
    grid-area: right;
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--bg);
  }

  /* Heap chart */
  #heap-canvas { width: 100%; height: 120px; display: block; }
  .heap-wrap {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    position: relative;
  }
  .heap-label {
    font-size: 10px;
    color: var(--muted);
    position: absolute;
    top: 8px; right: 10px;
  }
  .heap-current {
    font-family: var(--display);
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  /* Lineage panel */
  .lineage-input {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 5px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 8px;
    outline: none;
    width: 100%;
  }
  .lineage-input:focus { border-color: var(--accent); }

  .lineage-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .lineage-row:last-child { border-bottom: none; }
  .lineage-site { font-size: 10px; color: var(--accent2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lineage-count { font-size: 11px; color: var(--text); }

  /* Callsites */
  .site-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .site-row:last-child { border-bottom: none; }
  .site-name { font-size: 10px; color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .site-count { font-size: 11px; color: var(--text); white-space: nowrap; }

  /* Agent config panel */
  .config-grid { display: flex; flex-direction: column; gap: 6px; }
  .config-row { display: flex; align-items: center; gap: 8px; }
  .config-lbl { font-size: 10px; color: var(--muted); width: 90px; flex-shrink: 0; }
  .config-input {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 6px;
    outline: none;
  }
  .config-input:focus { border-color: var(--accent); }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .empty-state { color: var(--muted); font-size: 11px; text-align: center; padding: 12px 0; }

  .view-btns { display: flex; gap: 4px; }

  .gc-item {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }
  .gc-item:last-child { border-bottom: none; }
  .gc-name { color: var(--muted); }
  .gc-val { color: var(--accent2); }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-dot"></div>
    MemoryIntel
  </div>
  <div class="status-pill">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">connecting...</span>
  </div>
  <div class="api-input-wrap">
    <span>API</span>
    <input type="text" id="api-base" value="http://localhost:7777" placeholder="http://localhost:7777" />
  </div>
  <button class="btn" id="connect-btn" onclick="reconnect()">Connect</button>
  <div class="view-btns">
    <button class="btn active" id="view-graph" onclick="setView('graph')">Graph</button>
    <button class="btn" id="view-heap"  onclick="setView('heap')">Heap</button>
  </div>
  <div class="header-stats">
    <div class="hstat"><span class="hstat-val" id="h-uptime">—</span><span class="hstat-lbl">uptime</span></div>
    <div class="hstat"><span class="hstat-val" id="h-events">—</span><span class="hstat-lbl">events</span></div>
    <div class="hstat"><span class="hstat-val" id="h-dropped">—</span><span class="hstat-lbl">dropped</span></div>
  </div>
</header>

<!-- LEFT PANEL -->
<div class="left-panel">

  <div class="panel-section">
    <div class="section-label">Track Packages</div>
    <div class="pkg-input-row">
      <input type="text" id="pkg-input" placeholder="com.example" onkeydown="if(event.key==='Enter')addPackage()"/>
      <button class="btn" onclick="addPackage()">+ Add</button>
    </div>
    <div id="pkg-tags"></div>
    <button class="btn" style="width:100%;margin-top:4px;" onclick="applyPackages()">Apply &amp; Restart Agent</button>
    <div id="cmd-preview" style="font-size:10px;color:var(--muted);word-break:break-all;display:none;padding:8px;background:var(--bg2);border-radius:4px;border:1px solid var(--border);"></div>
  </div>

  <div class="panel-section">
    <div class="section-label">Allocation Counts</div>
    <div id="alloc-list"></div>
  </div>

  <div class="panel-section">
    <div class="section-label">Leak Suspects</div>
    <div id="leak-list"></div>
  </div>

</div>

<!-- CANVAS -->
<div id="canvas-wrap">
  <canvas id="graph-canvas"></canvas>
  <div class="tooltip" id="tooltip">
    <div class="tooltip-title" id="tt-title"></div>
    <div class="tooltip-row"><span>Count</span><span id="tt-count"></span></div>
    <div class="tooltip-row"><span>Rate/s</span><span id="tt-rate"></span></div>
    <div class="tooltip-row"><span>Allocator</span><span id="tt-site"></span></div>
  </div>
  <div class="canvas-overlay">
    <button class="btn" onclick="resetCamera()">Reset view</button>
    <button class="btn" onclick="toggleSpin()">Toggle spin</button>
  </div>
</div>

<!-- RIGHT PANEL -->
<div class="right-panel">

  <div class="panel-section">
    <div class="section-label">Heap Usage</div>
    <div class="heap-wrap">
      <div class="heap-current" id="heap-current">— MB</div>
      <span class="heap-label" id="heap-pct">—%</span>
      <canvas id="heap-canvas"></canvas>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-label">Lineage Lookup</div>
    <input class="lineage-input" id="lineage-input" placeholder="java.util.ArrayList" oninput="debouncedLineage()"/>
    <div id="lineage-list"></div>
  </div>

  <div class="panel-section">
    <div class="section-label">Top Call Sites</div>
    <div id="sites-list"></div>
  </div>

  <div class="panel-section">
    <div class="section-label">Agent Config</div>
    <div class="config-grid">
      <div class="config-row">
        <span class="config-lbl">Sample (ms)</span>
        <input class="config-input" id="cfg-sample" type="number" value="1000"/>
      </div>
      <div class="config-row">
        <span class="config-lbl">Max queue</span>
        <input class="config-input" id="cfg-queue" type="number" value="50000"/>
      </div>
      <div class="config-row">
        <span class="config-lbl">Port</span>
        <input class="config-input" id="cfg-port" type="number" value="7777"/>
      </div>
    </div>
    <button class="btn" style="width:100%;margin-top:6px;" onclick="showStartCmd()">Generate start command</button>
    <div id="start-cmd" style="display:none;margin-top:6px;font-size:10px;color:var(--accent2);word-break:break-all;padding:8px;background:var(--bg2);border-radius:4px;border:1px solid var(--border);white-space:pre-wrap;"></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let apiBase = 'http://localhost:7777';
let connected = false;
let pollInterval = null;
let spinning = true;
let currentView = 'graph';
let packages = [];
let data = { allocations: [], rates: {}, leaks: [], callsites: [], heap: [], lineage: [] };
let selectedClass = null;

// ═══════════════════════════════════════════════════════
// THREE.JS GRAPH
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('graph-canvas');
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 2000);
camera.position.set(0, 0, 350);

let nodes3D = [];
let edges3D = [];
let nodeObjects = [];
let edgeObjects = [];
let labelSprites = [];
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let cameraTheta = 0, cameraPhi = 0.3, cameraR = 350;
let spinAngle = 0;

// Ambient + point lights
scene.add(new THREE.AmbientLight(0x333355, 2));
const ptLight = new THREE.PointLight(0x7c6af7, 3, 600);
ptLight.position.set(0, 100, 200);
scene.add(ptLight);
const ptLight2 = new THREE.PointLight(0x3dd9a4, 2, 400);
ptLight2.position.set(-100, -80, 100);
scene.add(ptLight2);

function resizeRenderer() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resizeRenderer();
window.addEventListener('resize', resizeRenderer);

// Mouse interaction
canvas.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('mouseup', () => { isDragging = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  if (isDragging) {
    const dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
    cameraTheta -= dx * 0.005;
    cameraPhi = Math.max(0.1, Math.min(Math.PI - 0.1, cameraPhi + dy * 0.005));
    prevMouse = { x: e.clientX, y: e.clientY };
    spinning = false;
  }
  checkHover(e);
});
canvas.addEventListener('wheel', e => {
  cameraR = Math.max(80, Math.min(800, cameraR + e.deltaY * 0.4));
});
canvas.addEventListener('click', e => {
  if (Math.abs(e.movementX) + Math.abs(e.movementY) > 3) return;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeObjects.map(n => n.mesh));
  if (hits.length > 0) {
    const idx = nodeObjects.findIndex(n => n.mesh === hits[0].object);
    if (idx >= 0) {
      selectedClass = nodeObjects[idx].label;
      document.getElementById('lineage-input').value = selectedClass;
      fetchLineage(selectedClass);
    }
  }
});

const tooltip = document.getElementById('tooltip');
function checkHover(e) {
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeObjects.map(n => n.mesh));
  if (hits.length > 0) {
    const idx = nodeObjects.findIndex(n => n.mesh === hits[0].object);
    const node = nodeObjects[idx];
    const rate = data.rates[node.label] || 0;
    const site = data.callsites.find(s => s.class_name && s.class_name.includes(node.shortLabel));
    document.getElementById('tt-title').textContent = node.label;
    document.getElementById('tt-count').textContent = (node.count || 0).toLocaleString();
    document.getElementById('tt-rate').textContent = rate.toFixed(1) + '/s';
    document.getElementById('tt-site').textContent = site ? site.class_name : '—';
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX - wrap.getBoundingClientRect().left + 12) + 'px';
    tooltip.style.top  = (e.clientY - wrap.getBoundingClientRect().top  - 20) + 'px';
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.style.display = 'none';
    canvas.style.cursor = 'default';
  }
}

function clearGraph() {
  nodeObjects.forEach(n => scene.remove(n.mesh));
  edgeObjects.forEach(e => scene.remove(e));
  nodeObjects = []; edgeObjects = [];
}

const classColors = [0x7c6af7, 0x3dd9a4, 0xf76a6a, 0xf7b76a, 0x6af7c8, 0xf76ac8, 0x6a9ff7, 0xd4f76a];

function buildGraph(allocations) {
  clearGraph();
  if (!allocations || allocations.length === 0) return;

  const maxCount = Math.max(...allocations.map(a => a.count), 1);
  const n = allocations.length;

  allocations.forEach((alloc, i) => {
    const angle = (i / n) * Math.PI * 2;
    const radius = 80 + (i % 3) * 40;
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius * 0.6;
    const z = (Math.random() - 0.5) * 80;

    const size = 4 + (alloc.count / maxCount) * 20;
    const geo = new THREE.SphereGeometry(size, 16, 12);
    const color = classColors[i % classColors.length];

    const isLeak = data.leaks.some(l => l.class_name === alloc.class_name);
    const mat = new THREE.MeshPhongMaterial({
      color: isLeak ? 0xf76a6a : color,
      shininess: 80,
      transparent: true,
      opacity: 0.9,
      emissive: isLeak ? 0x440000 : 0x111122,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    scene.add(mesh);

    const parts = alloc.class_name.split('.');
    const shortLabel = parts[parts.length - 1];
    nodeObjects.push({ mesh, label: alloc.class_name, shortLabel, count: alloc.count, x, y, z });

    // Draw edges to center (call-site hub)
    if (i < 8) {
      const points = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(x, y, z)];
      const geo2 = new THREE.BufferGeometry().setFromPoints(points);
      const mat2 = new THREE.LineBasicMaterial({ color: 0x333355, transparent: true, opacity: 0.4 });
      const line = new THREE.Line(geo2, mat2);
      scene.add(line);
      edgeObjects.push(line);
    }
  });

  // Center hub
  const hubGeo = new THREE.SphereGeometry(10, 20, 16);
  const hubMat = new THREE.MeshPhongMaterial({ color: 0x7c6af7, shininess: 120, emissive: 0x221144 });
  const hub = new THREE.Mesh(hubGeo, hubMat);
  scene.add(hub);
  nodeObjects.push({ mesh: hub, label: 'JVM allocator', shortLabel: 'JVM', count: 0 });
}

function resetCamera() {
  cameraTheta = 0; cameraPhi = 0.3; cameraR = 350;
  spinning = true;
}
function toggleSpin() { spinning = !spinning; }
function setView(v) {
  currentView = v;
  document.getElementById('view-graph').classList.toggle('active', v === 'graph');
  document.getElementById('view-heap').classList.toggle('active', v === 'heap');
}

// Animate
function animate() {
  requestAnimationFrame(animate);
  if (spinning) spinAngle += 0.003;
  const theta = cameraTheta + spinAngle;
  camera.position.x = cameraR * Math.sin(cameraPhi) * Math.sin(theta);
  camera.position.y = cameraR * Math.cos(cameraPhi);
  camera.position.z = cameraR * Math.sin(cameraPhi) * Math.cos(theta);
  camera.lookAt(0, 0, 0);

  // Pulse leaking nodes
  const t = performance.now() / 1000;
  nodeObjects.forEach((n, i) => {
    if (data.leaks.some(l => l.class_name === n.label)) {
      const pulse = 1 + 0.08 * Math.sin(t * 3 + i);
      n.mesh.scale.setScalar(pulse);
    }
  });

  renderer.render(scene, camera);
}
animate();

// ═══════════════════════════════════════════════════════
// HEAP SPARKLINE
// ═══════════════════════════════════════════════════════
const heapCanvas = document.getElementById('heap-canvas');
const hCtx = heapCanvas.getContext('2d');

function drawHeap(history) {
  const dpr = window.devicePixelRatio || 1;
  const w = heapCanvas.parentElement.clientWidth - 20;
  const h = 100;
  heapCanvas.width = w * dpr;
  heapCanvas.height = h * dpr;
  heapCanvas.style.width = w + 'px';
  heapCanvas.style.height = h + 'px';
  hCtx.scale(dpr, dpr);
  hCtx.clearRect(0, 0, w, h);

  if (!history || history.length < 2) return;

  const maxUsed = Math.max(...history.map(p => p.used_bytes));
  const maxMax = history[0].max_bytes;
  const points = history.slice(-80);
  const n = points.length;

  hCtx.beginPath();
  points.forEach((p, i) => {
    const x = (i / (n - 1)) * w;
    const y = h - (p.used_bytes / maxMax) * h * 0.9;
    i === 0 ? hCtx.moveTo(x, y) : hCtx.lineTo(x, y);
  });
  hCtx.strokeStyle = '#7c6af7';
  hCtx.lineWidth = 1.5;
  hCtx.stroke();

  // Fill under
  const last = points[points.length - 1];
  const lastX = w, lastY = h - (last.used_bytes / maxMax) * h * 0.9;
  hCtx.lineTo(lastX, h);
  hCtx.lineTo(0, h);
  const grad = hCtx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(124,106,247,0.25)');
  grad.addColorStop(1, 'rgba(124,106,247,0)');
  hCtx.fillStyle = grad;
  hCtx.fill();

  // GC drops — show in teal
  for (let i = 1; i < points.length; i++) {
    if (points[i].used_bytes < points[i-1].used_bytes * 0.7) {
      const x = (i / (n - 1)) * w;
      hCtx.beginPath();
      hCtx.moveTo(x, 0);
      hCtx.lineTo(x, h);
      hCtx.strokeStyle = 'rgba(61,217,164,0.3)';
      hCtx.lineWidth = 1;
      hCtx.stroke();
    }
  }
}

// ═══════════════════════════════════════════════════════
// PACKAGE TRACKING
// ═══════════════════════════════════════════════════════
function addPackage() {
  const input = document.getElementById('pkg-input');
  const val = input.value.trim();
  if (val && !packages.includes(val)) {
    packages.push(val);
    input.value = '';
    renderPackages();
    updateCmdPreview();
  }
}

function removePackage(pkg) {
  packages = packages.filter(p => p !== pkg);
  renderPackages();
  updateCmdPreview();
}

function renderPackages() {
  const el = document.getElementById('pkg-tags');
  el.innerHTML = packages.map(p => `
    <div class="pkg-tag" style="margin-bottom:4px;">
      <span>${p}</span>
      <button onclick="removePackage('${p}')">&times;</button>
    </div>
  `).join('');
}

function updateCmdPreview() {
  const el = document.getElementById('cmd-preview');
  if (packages.length === 0) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  const track = packages.join(';');
  const port = document.getElementById('cfg-port').value || '7777';
  el.textContent = `track=${track},httpPort=${port}`;
}

function applyPackages() {
  const track = packages.join(';');
  const port = document.getElementById('cfg-port').value || '7777';
  const sample = document.getElementById('cfg-sample').value || '1000';
  const agentArgs = `sampleInterval=${sample},httpPort=${port}${track ? ',track=' + track : ''}`;
  const cmd = `java -javaagent:target/memory-intel-agent-1.0.0-jar-with-dependencies.jar=${agentArgs} \\\n  -cp target/memory-intel-agent-1.0.0-jar-with-dependencies.jar \\\n  com.memoryintel.demo.DemoApp`;
  const el = document.getElementById('start-cmd');
  el.textContent = cmd;
  el.style.display = 'block';
  showStartCmd();
}

function showStartCmd() {
  const port = document.getElementById('cfg-port').value || '7777';
  const sample = document.getElementById('cfg-sample').value || '1000';
  const track = packages.join(';');
  const agentArgs = `sampleInterval=${sample},httpPort=${port}${track ? ',track=' + track : ''}`;
  const cmd = `TRACK=${track || 'com.yourapp'} HTTP_PORT=${port} ./start.sh target/memory-intel-agent-1.0.0-jar-with-dependencies.jar\n\n# Or manually:\njava "-javaagent:target/memory-intel-agent-1.0.0-jar-with-dependencies.jar=${agentArgs}" \\\n  -cp target/memory-intel-agent-1.0.0-jar-with-dependencies.jar \\\n  com.memoryintel.demo.DemoApp`;
  const el = document.getElementById('start-cmd');
  el.textContent = cmd;
  el.style.display = el.style.display === 'none' ? 'block' : 'block';
}

// ═══════════════════════════════════════════════════════
// API FETCHING
// ═══════════════════════════════════════════════════════
function reconnect() {
  apiBase = document.getElementById('api-base').value.trim().replace(/\/$/, '');
  if (pollInterval) clearInterval(pollInterval);
  fetchAll();
  pollInterval = setInterval(fetchAll, 3000);
}

async function safeFetch(url) {
  try {
    const r = await fetch(url, { signal: AbortSignal.timeout(4000) });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch { return null; }
}

async function fetchAll() {
  const [status, alloc, rates, leaks, sites, heap] = await Promise.all([
    safeFetch(apiBase + '/api/status'),
    safeFetch(apiBase + '/api/allocations/top'),
    safeFetch(apiBase + '/api/allocations/rates'),
    safeFetch(apiBase + '/api/leaks'),
    safeFetch(apiBase + '/api/callsites/top'),
    safeFetch(apiBase + '/api/heap/history'),
  ]);

  const ok = !!status;
  connected = ok;
  document.getElementById('status-dot').className = 'status-dot' + (ok ? ' live' : '');
  document.getElementById('status-text').textContent = ok ? 'live' : 'disconnected';

  if (status) {
    document.getElementById('h-uptime').textContent = status.uptime_secs + 's';
    document.getElementById('h-events').textContent = (status.events_processed || 0).toLocaleString();
    document.getElementById('h-dropped').textContent = (status.queue_dropped || 0).toLocaleString();
  }

  if (alloc && alloc.classes) {
    data.allocations = alloc.classes;
    renderAllocations(alloc.classes);
    buildGraph(alloc.classes);
  }

  if (rates && rates.classes) {
    data.rates = {};
    rates.classes.forEach(r => { data.rates[r.class_name] = r.rate_per_sec; });
  }

  if (leaks && leaks.suspects) {
    data.leaks = leaks.suspects;
    renderLeaks(leaks.suspects);
  }

  if (sites && sites.sites) {
    data.callsites = sites.sites;
    renderSites(sites.sites);
  }

  if (heap && heap.history && heap.history.length > 0) {
    data.heap = heap.history;
    const last = heap.history[heap.history.length - 1];
    const mb = (last.used_bytes / 1024 / 1024).toFixed(1);
    const pct = last.max_bytes > 0 ? ((last.used_bytes / last.max_bytes) * 100).toFixed(1) : '—';
    document.getElementById('heap-current').textContent = mb + ' MB';
    document.getElementById('heap-pct').textContent = pct + '%';
    drawHeap(heap.history);
  }
}

// ═══════════════════════════════════════════════════════
// RENDER PANELS
// ═══════════════════════════════════════════════════════
function renderAllocations(classes) {
  const el = document.getElementById('alloc-list');
  if (!classes.length) { el.innerHTML = '<div class="empty-state">no data yet</div>'; return; }
  const max = classes[0].count || 1;
  const colors = ['#7c6af7','#3dd9a4','#f7b76a','#f76a6a','#6af7c8','#f76ac8','#6a9ff7','#d4f76a'];
  el.innerHTML = classes.slice(0, 10).map((c, i) => {
    const parts = c.class_name.split('.');
    const short = parts[parts.length - 1];
    const rate = data.rates[c.class_name] || 0;
    const pct = Math.max(2, (c.count / max) * 100);
    return `<div class="alloc-row" onclick="selectClass('${c.class_name}')">
      <div class="alloc-name">${short} <span style="color:var(--muted);font-size:10px;">${parts.slice(0,-1).join('.')}</span></div>
      <div class="alloc-bar-wrap"><div class="alloc-bar" style="width:${pct}%;background:${colors[i%colors.length]};"></div></div>
      <div class="alloc-meta">
        <span class="alloc-count">${c.count.toLocaleString()}</span>
        <span class="alloc-rate">${rate > 0 ? rate.toFixed(0) + '/s' : ''}</span>
      </div>
    </div>`;
  }).join('');
}

function selectClass(cls) {
  selectedClass = cls;
  document.getElementById('lineage-input').value = cls;
  fetchLineage(cls);
}

function renderLeaks(suspects) {
  const el = document.getElementById('leak-list');
  if (!suspects.length) { el.innerHTML = '<div class="empty-state">no suspects</div>'; return; }
  el.innerHTML = suspects.map(s => {
    const short = s.class_name.split('.').pop();
    return `<div class="leak-item">
      <div class="leak-header">
        <span class="leak-name">${short}</span>
        <span class="confidence-badge conf-${s.confidence}">${s.confidence}</span>
      </div>
      <div class="leak-evidence">${s.evidence.join(' · ')}</div>
    </div>`;
  }).join('');
}

function renderSites(sites) {
  const el = document.getElementById('sites-list');
  if (!sites.length) { el.innerHTML = '<div class="empty-state">no data yet</div>'; return; }
  el.innerHTML = sites.slice(0, 8).map(s => {
    const name = s.class_name || '—';
    return `<div class="site-row">
      <span class="site-name">${name}</span>
      <span class="site-count">${(s.count || 0).toLocaleString()}</span>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════
// LINEAGE
// ═══════════════════════════════════════════════════════
let lineageTimer = null;
function debouncedLineage() {
  clearTimeout(lineageTimer);
  lineageTimer = setTimeout(() => {
    const val = document.getElementById('lineage-input').value.trim();
    if (val) fetchLineage(val);
  }, 600);
}

async function fetchLineage(cls) {
  const data = await safeFetch(apiBase + '/api/lineage?class=' + encodeURIComponent(cls));
  const el = document.getElementById('lineage-list');
  if (!data || !data.lineage || !data.lineage.length) {
    el.innerHTML = '<div class="empty-state">no lineage data</div>';
    return;
  }
  el.innerHTML = data.lineage.map(l => `
    <div class="lineage-row">
      <span class="lineage-site">${l.site}</span>
      <span class="lineage-count">${l.count.toLocaleString()}</span>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
reconnect();
</script>
